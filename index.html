<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <!-- Mobile: no zoom, viewport-fit=cover for notch/home-indicator safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Campus Connect — UEM Kolkata</title>
    <meta name="description" content="Campus Connect is the official AI assistant for UEM Kolkata. Find sections, faculty cabins, and room locations." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Drifting dots background -->
    <div class="drifting-dots"></div>

    <!-- Ambient blobs -->
    <div class="blobs-layer">
        <div class="ambient-blob blob-top"></div>
        <div class="ambient-blob blob-bottom"></div>
    </div>

    <!-- ── Header ── -->
    <header class="top-bar">
        <button class="icon-btn" id="menuBtn" aria-label="Quick topics">
            <span class="material-symbols-outlined">blur_on</span>
        </button>
        <div class="brand">
            <h1>Campus Connect</h1>
            <div class="pulse-dot"></div>
        </div>
        <button class="icon-btn" id="settingsBtn" aria-label="UEM Kolkata">
            <span class="material-symbols-outlined">school</span>
        </button>
    </header>

    <!-- ── Collapsible chips bar ── -->
    <div class="chips-bar" id="chipsBar">
        <button class="chip" onclick="UI.quickSend('Where is Section A?')">📍 Sections</button>
        <button class="chip" onclick="UI.quickSend('Show all Physics faculty')">👨‍🏫 Faculty</button>
        <button class="chip" onclick="UI.quickSend('Where is the library?')">📚 Library</button>
        <button class="chip" onclick="UI.quickSend('Where is the cafeteria?')">🍽️ Cafeteria</button>
        <button class="chip" onclick="UI.quickSend('Who are the mentors for Section E?')">🧑‍🏫 Mentors</button>
    </div>

    <!-- ── Chat stream ── -->
    <main class="chat-stream" id="chatMessages"></main>

    <!-- ── Input bar ── -->
    <div class="input-bar">
        <div class="input-wrap">
            <input
                id="userInput"
                type="text"
                inputmode="text"
                enterkeyhint="send"
                placeholder="Ask about sections, faculty, rooms…"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="sentences"
                spellcheck="false"
            />
            <div class="cursor-blink"></div>
        </div>
        <button class="send-btn" id="sendBtn" aria-label="Send">
            <span class="material-symbols-outlined">send</span>
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const ok = await window.SearchEngine.init();
            if (ok) {
                window.UI.init();
            } else {
                document.getElementById('chatMessages').innerHTML =
                    '<div class="error-msg">⚠️ Failed to load campus data. Please refresh.</div>';
            }

            // Toggle chips bar
            document.getElementById('menuBtn').addEventListener('click', () => {
                document.getElementById('chipsBar').classList.toggle('open');
            });

            // Close chips bar when tapping outside
            document.getElementById('chatMessages').addEventListener('click', () => {
                document.getElementById('chipsBar').classList.remove('open');
            });

            // iOS keyboard: scroll to bottom when keyboard opens
            if ('visualViewport' in window) {
                window.visualViewport.addEventListener('resize', () => {
                    const stream = document.getElementById('chatMessages');
                    stream.scrollTop = stream.scrollHeight;
                });
            }
        });
    </script>
</body>
</html>
