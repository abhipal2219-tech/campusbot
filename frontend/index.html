<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Connect — UEM Kolkata</title>
    <meta name="description" content="Campus Connect is the official AI assistant for UEM Kolkata. Find sections, faculty cabins, and room locations." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Drifting dots background -->
    <div class="drifting-dots"></div>

    <!-- Ambient blobs -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="ambient-blob" style="width:400px;height:400px;top:-15%;left:-10%;"></div>
        <div class="ambient-blob" style="width:500px;height:500px;bottom:-20%;right:-10%;background:#a0a0a0;"></div>
    </div>

    <!-- ── Header ── -->
    <header class="top-bar">
        <button class="icon-btn" id="menuBtn" aria-label="Menu" title="Quick topics">
            <span class="material-symbols-outlined">blur_on</span>
        </button>
        <div class="brand">
            <h1>Campus Connect</h1>
            <div class="pulse-dot" id="statusDot"></div>
        </div>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="UEM Kolkata">
            <span class="material-symbols-outlined">school</span>
        </button>
    </header>

    <!-- ── Suggested prompt chips (shown below header on menu tap) ── -->
    <div class="chips-bar" id="chipsBar">
        <button class="chip" onclick="window.UI.quickSend('Where is Section A?')">📍 Sections</button>
        <button class="chip" onclick="window.UI.quickSend('Show all Physics faculty')">👨‍🏫 Faculty</button>
        <button class="chip" onclick="window.UI.quickSend('Where is the library?')">📚 Library</button>
        <button class="chip" onclick="window.UI.quickSend('Where is the cafeteria?')">🍽️ Cafeteria</button>
        <button class="chip" onclick="window.UI.quickSend('Who are the mentors for Section E?')">🧑‍🏫 Mentors</button>
    </div>

    <!-- ── Chat stream ── -->
    <main class="chat-stream" id="chatMessages"></main>

    <!-- ── Input bar ── -->
    <div class="input-bar">
        <div class="input-wrap">
            <input
                id="userInput"
                type="text"
                placeholder="Ask about sections, faculty, rooms…"
                autocomplete="off"
            />
            <div class="cursor-blink"></div>
        </div>
        <button class="send-btn" id="sendBtn" aria-label="Send">
            <span class="material-symbols-outlined">send</span>
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const ok = await window.SearchEngine.init();
            if (ok) {
                window.UI.init();
            } else {
                document.getElementById('chatMessages').innerHTML =
                    '<div class="error-msg">⚠️ Failed to load campus data. Please refresh.</div>';
            }

            // Toggle chips bar
            document.getElementById('menuBtn').addEventListener('click', () => {
                document.getElementById('chipsBar').classList.toggle('open');
            });
        });
    </script>
</body>
</html>
